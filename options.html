<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>PR & Jira Tracker – Settings</title>
  <link rel="stylesheet" href="options.css">
</head>
<body>
  <div class="container">
    <h1>Settings</h1>

    <section>
      <h2>GitHub</h2>
      <div class="field">
        <label for="github-token">Personal Access Token</label>
        <input type="password" id="github-token" placeholder="ghp_…" autocomplete="off">
        <p class="hint">Needs <code>repo</code> scope. Generate at
          <a href="https://github.com/settings/tokens" target="_blank">github.com/settings/tokens</a>.</p>
      </div>
      <div class="field">
        <label for="repos">Repositories <span class="label-sub">(one per line)</span></label>
        <textarea id="repos" rows="5" placeholder="owner/repo&#10;org/another-repo"></textarea>
      </div>
    </section>

    <section>
      <h2>Jira</h2>
      <div class="field">
        <label for="jira-url">Jira URL</label>
        <input type="url" id="jira-url" placeholder="https://yourcompany.atlassian.net">
        <p class="hint">Atlassian Cloud only (*.atlassian.net).</p>
      </div>
      <div class="field">
        <label for="jira-email">Email</label>
        <input type="email" id="jira-email" placeholder="you@company.com">
      </div>
      <div class="field">
        <label for="jira-token">API Token</label>
        <input type="password" id="jira-token" placeholder="Your Jira API token" autocomplete="off">
        <p class="hint">Generate at
          <a href="https://id.atlassian.com/manage-profile/security/api-tokens" target="_blank">
            id.atlassian.com → API tokens</a>.</p>
      </div>
      <div class="field">
        <label for="jira-projects">Project Keys <span class="label-sub">(comma-separated)</span></label>
        <input type="text" id="jira-projects" placeholder="EH, HERO, PROJ">
      </div>
    </section>

    <div class="actions">
      <button id="save-btn">Save</button>
      <span class="save-msg" id="save-msg"></span>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>
